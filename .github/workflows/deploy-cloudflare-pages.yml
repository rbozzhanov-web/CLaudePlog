name: Deploy PWA to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Cloudflare Pages project name (created beforehand in the Cloudflare dashboard)'
        required: true
        default: 'pwaplog'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx jest

      - name: Export static web build
        run: npx expo export -p web

      # OPFS needs SharedArrayBuffer, which needs these on every response — GitHub Pages can't set
      # custom headers at all, which is the whole reason this deploys to Cloudflare Pages instead.
      # public/_headers is copied into dist/ by the export above; this just fails loudly if the
      # file it depends on ever goes missing, rather than shipping a build that can't open its DB.
      - name: Verify COOP/COEP headers file made it into the export
        run: test -f dist/_headers

      # cloudflare/pages-action is deprecated in favor of wrangler-action; this is the deploy
      # command it recommends in its own place, `pages deploy <dir> --project-name=<name>`.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ inputs.project_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
